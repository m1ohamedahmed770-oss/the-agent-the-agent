<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="64" fill="url(#grad1)"/>
  
  <!-- Robot head -->
  <rect x="40" y="30" width="48" height="50" rx="8" fill="#fff" opacity="0.95"/>
  
  <!-- Eyes -->
  <circle cx="50" cy="45" r="6" fill="#667eea"/>
  <circle cx="78" cy="45" r="6" fill="#667eea"/>
  
  <!-- Mouth -->
  <path d="M 50 60 Q 64 68 78 60" stroke="#667eea" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Body -->
  <rect x="45" y="85" width="38" height="30" rx="4" fill="#fff" opacity="0.9"/>
  
  <!-- Arms -->
  <rect x="25" y="90" width="20" height="10" rx="5" fill="#fff" opacity="0.9"/>
  <rect x="83" y="90" width="20" height="10" rx="5" fill="#fff" opacity="0.9"/>
  
  <!-- Glow effect -->
  <circle cx="64" cy="64" r="60" fill="none" stroke="#fff" stroke-width="1" opacity="0.3"/>
</svg>
